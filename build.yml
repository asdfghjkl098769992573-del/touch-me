name: Build Touch Me APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate Android project
        run: |
          cat > settings.gradle <<'TOUCHME_EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "TouchMe"
          include ':app'
          TOUCHME_EOF
          cat > build.gradle <<'TOUCHME_EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          TOUCHME_EOF
          cat > gradle.properties <<'TOUCHME_EOF'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.nonTransitiveRClass=true
          TOUCHME_EOF
          mkdir -p app
          cat > app/build.gradle <<'TOUCHME_EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.touchme.app'
              compileSdk 34

              defaultConfig {
                  applicationId "com.touchme.app"
                  minSdk 26
                  targetSdk 30
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          TOUCHME_EOF
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'TOUCHME_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <!-- No INTERNET permission on purpose: the app is fully offline. -->
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.ACCESS_NOTIFICATION_POLICY" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />

              <application
                  android:allowBackup="false"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:label="Touch Me"
                  android:theme="@style/Theme.TouchMe">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:configChanges="orientation|screenSize|screenLayout|smallestScreenSize|keyboardHidden|keyboard|density|uiMode">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".JeeService"
                      android:exported="false" />

                  <receiver
                      android:name=".BootReceiver"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                      </intent-filter>
                  </receiver>
              </application>
          </manifest>
          TOUCHME_EOF
          mkdir -p app/src/main/java/com/touchme/app
          cat > app/src/main/java/com/touchme/app/MainActivity.java <<'TOUCHME_EOF'
          package com.touchme.app;

          import android.annotation.SuppressLint;
          import android.app.Activity;
          import android.app.NotificationManager;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.ActivityInfo;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.view.View;
          import android.view.WindowManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {

              private WebView web;
              private SharedPreferences prefs;
              private boolean sessionActive = false;

              @SuppressLint({"SetJavaScriptEnabled", "AddJavascriptInterface"})
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  prefs = getSharedPreferences("touchme_native", MODE_PRIVATE);
                  restoreDndIfLeftOn();

                  web = new WebView(this);
                  web.setBackgroundColor(Color.BLACK);
                  web.setOverScrollMode(View.OVER_SCROLL_NEVER);

                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setTextZoom(100);
                  s.setAllowFileAccess(true);

                  web.setWebViewClient(new WebViewClient());
                  web.addJavascriptInterface(new Bridge(), "Android");
                  setContentView(web);
                  web.loadUrl("file:///android_asset/index.html");
                  hideBars();
              }

              @SuppressWarnings("deprecation")
              private void hideBars() {
                  getWindow().getDecorView().setSystemUiVisibility(
                          View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                                  | View.SYSTEM_UI_FLAG_FULLSCREEN
                                  | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                                  | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                                  | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                                  | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN);
              }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) hideBars();
              }

              /** While a study session is running, the back button is ignored so you can't leave by accident. */
              @Override
              public void onBackPressed() {
                  if (sessionActive) return;
                  super.onBackPressed();
              }

              @Override
              protected void onDestroy() {
                  applyDnd(false);
                  super.onDestroy();
              }

              // ---------- Do Not Disturb ----------

              private NotificationManager nm() {
                  return (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
              }

              /** If the app was killed during focus, put the phone's sound mode back on next launch. */
              private void restoreDndIfLeftOn() {
                  int saved = prefs.getInt("dnd_saved", -1);
                  if (saved == -1) return;
                  try {
                      NotificationManager n = nm();
                      if (n.isNotificationPolicyAccessGranted()) n.setInterruptionFilter(saved);
                  } catch (Exception ignored) {
                  }
                  prefs.edit().putInt("dnd_saved", -1).apply();
              }

              /** "Alarms only": blocks notifications and calls but keeps alarms and the app's own chime. */
              private void applyDnd(boolean on) {
                  try {
                      NotificationManager n = nm();
                      if (!n.isNotificationPolicyAccessGranted()) return;
                      int saved = prefs.getInt("dnd_saved", -1);
                      if (on) {
                          if (saved == -1) {
                              int cur = n.getCurrentInterruptionFilter();
                              if (cur < 1 || cur > 4) cur = NotificationManager.INTERRUPTION_FILTER_ALL;
                              prefs.edit().putInt("dnd_saved", cur).apply();
                          }
                          n.setInterruptionFilter(NotificationManager.INTERRUPTION_FILTER_ALARMS);
                      } else if (saved != -1) {
                          n.setInterruptionFilter(saved);
                          prefs.edit().putInt("dnd_saved", -1).apply();
                      }
                  } catch (Exception ignored) {
                  }
              }

              // ---------- JavaScript bridge (window.Android in the web app) ----------

              private class Bridge {

                  @JavascriptInterface
                  public void session(final boolean on) {
                      runOnUiThread(() -> {
                          sessionActive = on;
                          if (on) getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                          else getWindow().clearFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                          hideBars();
                      });
                  }

                  @JavascriptInterface
                  public void dnd(final boolean on) {
                      runOnUiThread(() -> applyDnd(on));
                  }

                  @JavascriptInterface
                  public boolean hasDnd() {
                      try {
                          return nm().isNotificationPolicyAccessGranted();
                      } catch (Exception e) {
                          return false;
                      }
                  }

                  @JavascriptInterface
                  public void openDndSettings() {
                      runOnUiThread(() -> {
                          try {
                              startActivity(new Intent(Settings.ACTION_NOTIFICATION_POLICY_ACCESS_SETTINGS));
                          } catch (Exception ignored) {
                          }
                      });
                  }

                  @JavascriptInterface
                  public void lockLandscape(final boolean on) {
                      runOnUiThread(() -> setRequestedOrientation(on
                              ? ActivityInfo.SCREEN_ORIENTATION_SENSOR_LANDSCAPE
                              : ActivityInfo.SCREEN_ORIENTATION_UNSPECIFIED));
                  }

                  /** Starts or stops the permanent JEE countdown notification. */
                  @JavascriptInterface
                  public void jeeNotif(boolean on, double targetMillis, int unitMask) {
                      Intent svc = new Intent(MainActivity.this, JeeService.class);
                      if (on && targetMillis > 0) {
                          prefs.edit()
                                  .putBoolean("jee_on", true)
                                  .putLong("jee_target", (long) targetMillis)
                                  .putInt("jee_mask", unitMask)
                                  .apply();
                          try {
                              startForegroundService(svc);
                          } catch (Exception ignored) {
                          }
                      } else {
                          prefs.edit().putBoolean("jee_on", false).apply();
                          stopService(svc);
                      }
                  }
              }
          }
          TOUCHME_EOF
          mkdir -p app/src/main/java/com/touchme/app
          cat > app/src/main/java/com/touchme/app/JeeService.java <<'TOUCHME_EOF'
          package com.touchme.app;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.os.Handler;
          import android.os.IBinder;
          import android.os.Looper;

          import java.text.NumberFormat;
          import java.time.Duration;
          import java.time.Instant;
          import java.time.LocalDateTime;
          import java.time.ZoneId;
          import java.time.temporal.ChronoUnit;
          import java.util.Locale;

          /** Permanent, silent notification that shows the JEE Mains countdown. Updates once a minute to save battery. */
          public class JeeService extends Service {

              private static final String CHANNEL = "touchme_jee";
              private static final int NOTIF_ID = 7;

              private final Handler handler = new Handler(Looper.getMainLooper());
              private Notification.Builder builder;
              private NotificationManager manager;
              private long target;
              private int mask;

              private final Runnable tick = new Runnable() {
                  @Override
                  public void run() {
                      update();
                      long now = System.currentTimeMillis();
                      handler.postDelayed(this, 60000 - (now % 60000) + 200);
                  }
              };

              @Override
              public IBinder onBind(Intent intent) {
                  return null;
              }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  SharedPreferences p = getSharedPreferences("touchme_native", MODE_PRIVATE);
                  target = p.getLong("jee_target", 0);
                  mask = p.getInt("jee_mask", 15);

                  manager = (NotificationManager) getSystemService(NOTIFICATION_SERVICE);
                  if (manager.getNotificationChannel(CHANNEL) == null) {
                      NotificationChannel c = new NotificationChannel(
                              CHANNEL, "JEE countdown", NotificationManager.IMPORTANCE_LOW);
                      c.setShowBadge(false);
                      c.setSound(null, null);
                      c.enableVibration(false);
                      manager.createNotificationChannel(c);
                  }

                  Intent open = new Intent(this, MainActivity.class)
                          .addFlags(Intent.FLAG_ACTIVITY_SINGLE_TOP | Intent.FLAG_ACTIVITY_NEW_TASK);
                  PendingIntent pi = PendingIntent.getActivity(
                          this, 0, open, PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT);

                  builder = new Notification.Builder(this, CHANNEL)
                          .setSmallIcon(R.drawable.ic_stat)
                          .setContentTitle("JEE Mains")
                          .setContentText(text())
                          .setOngoing(true)
                          .setOnlyAlertOnce(true)
                          .setShowWhen(false)
                          .setContentIntent(pi)
                          .setCategory(Notification.CATEGORY_STATUS)
                          .setVisibility(Notification.VISIBILITY_PUBLIC);

                  // Must be called right after startForegroundService().
                  startForeground(NOTIF_ID, builder.build());

                  if (target <= 0) {
                      stopSelf();
                      return START_NOT_STICKY;
                  }

                  handler.removeCallbacks(tick);
                  handler.post(tick);
                  return START_STICKY;
              }

              @Override
              public void onDestroy() {
                  handler.removeCallbacks(tick);
                  super.onDestroy();
              }

              private void update() {
                  if (builder == null || manager == null) return;
                  builder.setContentText(text());
                  manager.notify(NOTIF_ID, builder.build());
              }

              private String text() {
                  if (target <= 0) return "Counting down";
                  ZoneId zone = ZoneId.systemDefault();
                  LocalDateTime now = LocalDateTime.now(zone);
                  LocalDateTime t = LocalDateTime.ofInstant(Instant.ofEpochMilli(target), zone);
                  if (!t.isAfter(now)) return "It's time. Go.";

                  long months = ChronoUnit.MONTHS.between(now, t);
                  long ms = Duration.between(now, t).toMillis();
                  NumberFormat nf = NumberFormat.getIntegerInstance(new Locale("en", "IN"));

                  StringBuilder sb = new StringBuilder();
                  if ((mask & 1) != 0) add(sb, nf.format(months) + " mo");
                  if ((mask & 2) != 0) add(sb, nf.format(ms / 604800000L) + " wk");
                  if ((mask & 4) != 0) add(sb, nf.format(ms / 86400000L) + " d");
                  if ((mask & 8) != 0) add(sb, nf.format(ms / 3600000L) + " h");
                  return sb.length() == 0 ? "Counting down" : sb.toString();
              }

              private static void add(StringBuilder sb, String part) {
                  if (sb.length() > 0) sb.append("  ·  ");
                  sb.append(part);
              }
          }
          TOUCHME_EOF
          mkdir -p app/src/main/java/com/touchme/app
          cat > app/src/main/java/com/touchme/app/BootReceiver.java <<'TOUCHME_EOF'
          package com.touchme.app;

          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;

          /** Brings the permanent countdown notification back after the phone restarts. */
          public class BootReceiver extends BroadcastReceiver {
              @Override
              public void onReceive(Context context, Intent intent) {
                  if (!Intent.ACTION_BOOT_COMPLETED.equals(intent.getAction())) return;
                  SharedPreferences p = context.getSharedPreferences("touchme_native", Context.MODE_PRIVATE);
                  if (!p.getBoolean("jee_on", false)) return;
                  try {
                      context.startForegroundService(new Intent(context, JeeService.class));
                  } catch (Exception ignored) {
                  }
              }
          }
          TOUCHME_EOF
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/styles.xml <<'TOUCHME_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.TouchMe" parent="android:Theme.Material.NoActionBar">
                  <item name="android:windowBackground">@android:color/black</item>
                  <item name="android:statusBarColor">@android:color/black</item>
                  <item name="android:navigationBarColor">@android:color/black</item>
                  <item name="android:windowFullscreen">true</item>
              </style>
          </resources>
          TOUCHME_EOF
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/colors.xml <<'TOUCHME_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_bg">#000000</color>
          </resources>
          TOUCHME_EOF
          mkdir -p app/src/main/res/drawable
          cat > app/src/main/res/drawable/ic_fg.xml <<'TOUCHME_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#00000000"
                  android:strokeColor="#FFFFFF"
                  android:strokeWidth="3"
                  android:pathData="M54,54m-22,0a22,22 0 1,0 44,0a22,22 0 1,0 -44,0" />
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M53,40h2v15h-2z M53,54h10v2h-10z" />
          </vector>
          TOUCHME_EOF
          mkdir -p app/src/main/res/drawable
          cat > app/src/main/res/drawable/ic_stat.xml <<'TOUCHME_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path
                  android:fillColor="#FFFFFFFF"
                  android:fillType="evenOdd"
                  android:pathData="M12,2a10,10 0 1,0 0,20a10,10 0 1,0 0,-20zM12,4a8,8 0 1,1 0,16a8,8 0 1,1 0,-16z" />
              <path
                  android:fillColor="#FFFFFFFF"
                  android:pathData="M11,7h2v6h-2z M11,12h5v2h-5z" />
          </vector>
          TOUCHME_EOF
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'TOUCHME_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_bg" />
              <foreground android:drawable="@drawable/ic_fg" />
          </adaptive-icon>
          TOUCHME_EOF
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml <<'TOUCHME_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_bg" />
              <foreground android:drawable="@drawable/ic_fg" />
          </adaptive-icon>
          TOUCHME_EOF
          test -f index.html || { echo "index.html is missing from the repo root"; exit 1; }
          mkdir -p app/src/main/assets
          cp index.html app/src/main/assets/index.html
          find . -path ./.git -prune -o -type f -print | sort

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: touch-me-apk
          path: app/build/outputs/apk/debug/app-debug.apk
